<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>回页 · 访问看板</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">仅保存在这台电脑</p>
        <h1>回页 · 访问看板</h1>
        <p class="subtitle">只统计作品集首页的匿名设备，不记录访问者身份。</p>
      </div>
      <div class="actions">
        <a href="/exclude">排除本机访问</a>
        <button id="refresh">刷新</button>
      </div>
    </header>

    <section class="status" aria-live="polite">
      <span class="dot"></span><span id="status">正在读取线上汇总…</span>
      <time id="updated"></time>
    </section>

    <section class="periods" aria-label="访问概览">
      <article><p>今天</p><strong id="today-devices">—</strong><span>匿名设备</span><small id="today-detail">—</small></article>
      <article><p>近 7 天</p><strong id="week-devices">—</strong><span>匿名设备</span><small id="week-detail">—</small></article>
      <article><p>近 30 天</p><strong id="month-devices">—</strong><span>匿名设备</span><small id="month-detail">—</small></article>
      <article><p>近 30 天成功率</p><strong id="success-rate">—</strong><span>已确认 / 全部会话</span><small id="latest">最近成功：—</small></article>
    </section>

    <section class="chart-card">
      <div class="section-head"><div><p class="eyebrow">TREND</p><h2>近 30 天访问趋势</h2></div><p>绿色为已确认，浅色为未确认。</p></div>
      <div id="chart" class="chart" aria-label="近 30 天访问趋势"></div>
    </section>

    <footer>每 60 秒自动更新 · 数据保留 90 天 · 未确认不等于失败</footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
