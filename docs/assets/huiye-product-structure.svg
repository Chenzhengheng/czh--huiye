<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">回页产品结构图</title><desc id="desc">回页从用户原话、AI 幕后能力、陪伴式体验到用户主权的四层产品结构。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#74756e"/></marker><style>.t{font:600 30px "Microsoft YaHei",sans-serif;fill:#292821}.s{font:400 14px "Microsoft YaHei",sans-serif;fill:#77756b}.k{font:600 13px "Microsoft YaHei",sans-serif;fill:#8b6b42;letter-spacing:1px}.h{font:600 18px "Microsoft YaHei",sans-serif;fill:#33342f}.p{font:400 12px "Microsoft YaHei",sans-serif;fill:#6f716a}.line{fill:none;stroke:#74756e;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="900" fill="#f8f6ef"/><text class="t" x="65" y="60">回页 · 产品结构</text><text class="s" x="65" y="88">AI 是幕后能力；用户原话、选择权和重逢感构成产品中心。</text>
  <g transform="translate(90 160)"><rect width="300" height="560" rx="22" fill="#fffefa" stroke="#d7d3c8"/><text class="k" x="30" y="48">01 · 用户留下</text><text class="h" x="30" y="85">一小片真实的自己</text><text class="p" x="30" y="125">思考</text><text class="p" x="30" y="160">感受</text><text class="p" x="30" y="195">疑问与判断</text><text class="p" x="30" y="230">自己说出的话</text><text class="p" x="30" y="265">没有观点的生活片段</text><line x1="30" y1="300" x2="270" y2="300" stroke="#e3e0d7"/><text class="p" x="30" y="340">不保存独立理论知识</text><text class="p" x="30" y="375">不建设知识图谱</text><text class="p" x="30" y="410">原意不被无痕覆盖</text><text class="h" x="30" y="495">Entry</text><text class="p" x="30" y="525">用户确认后才成为事实</text></g>
  <g transform="translate(450 160)"><rect width="300" height="560" rx="22" fill="#f1f3ee" stroke="#cfd5ca"/><text class="k" x="30" y="48">02 · AI 在幕后</text><text class="h" x="30" y="85">找回，而不是代替</text><text class="p" x="30" y="125">发现有证据的联系</text><text class="p" x="30" y="160">受约束的单页回看</text><text class="p" x="30" y="195">判断是否仍在当前认知</text><text class="p" x="30" y="230">选择时机与冷却</text><text class="p" x="30" y="265">提出可修正的初判</text><line x1="30" y1="300" x2="270" y2="300" stroke="#d9ddd5"/><text class="p" x="30" y="340">不把正确等同于有价值</text><text class="p" x="30" y="375">不用情绪浓度冒充重逢</text><text class="p" x="30" y="410">不输出人格或人生定论</text><text class="h" x="30" y="495">校准式懂我</text><text class="p" x="30" y="525">从真实 good/bad case 学习</text></g>
  <g transform="translate(810 160)"><rect width="300" height="560" rx="22" fill="#f4ede3" stroke="#c7a77d"/><text class="k" x="30" y="48">03 · 陪伴式体验</text><text class="h" x="30" y="85">有一页轻轻回来</text><text class="p" x="30" y="125">无数字的小提示</text><text class="p" x="30" y="160">一次只呈现一个候选</text><text class="p" x="30" y="195">原句 → 节选 → 全文</text><text class="p" x="30" y="230">AI 初判位于原文之后</text><text class="p" x="30" y="265">没有下一条信息流</text><line x1="30" y1="300" x2="270" y2="300" stroke="#dfd3c2"/><text class="p" x="30" y="340">可以沉默回味</text><text class="p" x="30" y="375">可以给出可选反馈</text><text class="p" x="30" y="410">可以回一句或写一篇</text><text class="h" x="30" y="495">重逢感</text><text class="p" x="30" y="525">核心质量，不是写作转化</text></g>
  <g transform="translate(1170 160)"><rect width="240" height="560" rx="22" fill="#e6ebe1" stroke="#bac5b4"/><text class="k" x="25" y="48">04 · 用户主权</text><text class="h" x="25" y="85">解释权留给用户</text><text class="p" x="25" y="125">反馈完全可选</text><text class="p" x="25" y="160">沉默保持未知</text><text class="p" x="25" y="195">不满意可限定否定范围</text><text class="p" x="25" y="230">回应保存后双向可读</text><text class="p" x="25" y="265">多个矛盾回应可以并存</text><line x1="25" y1="300" x2="215" y2="300" stroke="#d4dbd0"/><text class="p" x="25" y="340">本地拥有原文</text><text class="p" x="25" y="375">可关闭回响许可</text><text class="p" x="25" y="410">可删除与导出</text><text class="h" x="25" y="495">边界式温暖</text><text class="p" x="25" y="525">不催促、不表演亲密</text></g>
  <path class="line" d="M390 440H445"/><path class="line" d="M750 440H805"/><path class="line" d="M1110 440H1165"/>
  <rect x="310" y="775" width="880" height="70" rx="35" fill="#66755f"/><text x="750" y="818" text-anchor="middle" style="font:500 17px 'Microsoft YaHei',sans-serif;fill:#fff">你写下的自己，会在另一个时刻重新回来，与你再次发生关系。</text>
</svg>
