<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050" role="img" aria-labelledby="title desc">
  <title id="title">回页产品结构图</title>
  <desc id="desc">回页由用户主动记录与归线、AI 线内观察、低打扰回响、评测校准和数据主权构成。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#77786f"/>
    </marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#292821}
      .subtitle{font:15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#77756b}
      .band{font:700 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52604d;letter-spacing:.08em}
      .card-title{font:700 20px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#292821}
      .body{font:14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#696860}
      .note{font:13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#7c796f}
      .card{fill:#fffefa;stroke:#d9d6cb;stroke-width:1.4}
      .green{fill:#e7ede3;stroke:#aebba9;stroke-width:1.4}
      .amber{fill:#f5ecdf;stroke:#d1a66f;stroke-width:1.4}
      .edge{fill:none;stroke:#77786f;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#b07b3e;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .rule{stroke:#dedbd1;stroke-width:1}
    </style>
  </defs>
  <rect width="1700" height="1050" fill="#f8f6ef"/>
  <text class="title" x="62" y="62">回页 · 产品结构</text>
  <text class="subtitle" x="62" y="91">用户划定思考边界，AI 在线内观察；正式体验保持温暖低打扰，评测工作台高频校准“是否真的看清”。</text>

  <rect x="55" y="125" width="1590" height="235" rx="22" fill="#fffdfa" stroke="#ddd9cf"/>
  <text class="band" x="82" y="163">01 · 用户主动 · 写下与划定边界</text>
  <rect class="card" x="95" y="195" width="300" height="125" rx="16"/>
  <text class="card-title" x="125" y="235">写下</text>
  <text class="body" x="125" y="269">思考、疑问、感受与正在形成的看法</text>
  <text class="note" x="125" y="297">用户确认保存后成为 Entry</text>
  <rect class="card" x="475" y="195" width="300" height="125" rx="16"/>
  <text class="card-title" x="505" y="235">日记池</text>
  <text class="body" x="505" y="269">搜索、查看、编辑与选择性归线</text>
  <text class="note" x="505" y="297">未归线日记也可正常存在</text>
  <rect class="green" x="855" y="195" width="330" height="125" rx="16"/>
  <text class="card-title" x="885" y="235">思考线</text>
  <text class="body" x="885" y="269">一条或多条用户建立的主题边界</text>
  <text class="note" x="885" y="297">最新在上 · 五行预览 · 展开原文</text>
  <rect class="card" x="1265" y="195" width="300" height="125" rx="16"/>
  <text class="card-title" x="1295" y="235">选择权</text>
  <text class="body" x="1295" y="269">单篇与整线均可关闭 AI 观察</text>
  <text class="note" x="1295" y="297">归线不是强制整理</text>
  <path class="edge" d="M395 257H464"/>
  <path class="edge" d="M775 257H844"/>
  <path class="edge" d="M1185 257H1254"/>

  <rect x="55" y="390" width="1590" height="220" rx="22" fill="#edf1ea" stroke="#ced7c9"/>
  <text class="band" x="82" y="428">02 · AI 观察 · 只在线内显化变化</text>
  <rect class="card" x="110" y="465" width="320" height="105" rx="16"/>
  <text class="card-title" x="140" y="505">找候选</text>
  <text class="body" x="140" y="538">同线、至少两篇、不同时间</text>
  <rect class="card" x="505" y="465" width="320" height="105" rx="16"/>
  <text class="card-title" x="535" y="505">过权限</text>
  <text class="body" x="535" y="538">整线允许 + 每篇允许</text>
  <rect class="card" x="900" y="465" width="320" height="105" rx="16"/>
  <text class="card-title" x="930" y="505">显化关系</text>
  <text class="body" x="930" y="538">延续 · 修正 · 分支 · 冲突 · 未解决</text>
  <rect class="green" x="1295" y="465" width="250" height="105" rx="16"/>
  <text class="card-title" x="1325" y="505">形成回响</text>
  <text class="body" x="1325" y="538">证据在前，初判在后</text>
  <path class="edge" d="M430 518H494"/>
  <path class="edge" d="M825 518H889"/>
  <path class="edge" d="M1220 518H1284"/>

  <rect x="55" y="640" width="1025" height="235" rx="22" fill="#fbf2e7" stroke="#dcc09a"/>
  <text class="band" x="82" y="678" fill="#8a6538">03 · 正式体验 · 陪伴式回响</text>
  <rect class="amber" x="95" y="712" width="250" height="120" rx="16"/>
  <text class="card-title" x="125" y="752">轻提示</text>
  <text class="body" x="125" y="785">一个小棕点，不形成待办</text>
  <text class="note" x="125" y="810">没有合适回响就保持安静</text>
  <rect class="card" x="405" y="712" width="280" height="120" rx="16"/>
  <text class="card-title" x="435" y="752">用户打开</text>
  <text class="body" x="435" y="785">原句 → 节选 → 全文 → AI 初判</text>
  <text class="note" x="435" y="810">先重逢自己，再看解释</text>
  <rect class="card" x="745" y="712" width="290" height="120" rx="16"/>
  <text class="card-title" x="775" y="752">自由回应</text>
  <text class="body" x="775" y="785">沉默 · 可选反馈 · 卡片内 EchoReply</text>
  <text class="note" x="775" y="810">回应不进日记池，与反馈互不推断</text>
  <path class="edge" d="M345 772H394"/>
  <path class="edge" d="M685 772H734"/>

  <rect x="1110" y="640" width="535" height="235" rx="22" fill="#f4eee4" stroke="#cda979" stroke-dasharray="10 8"/>
  <text class="band" x="1138" y="678" fill="#8a6538">04 · 当前验证 · 回响评测</text>
  <text class="card-title" x="1145" y="727">高频检查模型输出</text>
  <text class="body" x="1145" y="762">评测集 → 模型输出 → good / bad → 归因</text>
  <text class="body" x="1145" y="794">good / bad 与三类反馈、用户原话分别保存</text>
  <line class="rule" x1="1145" y1="817" x2="1605" y2="817"/>
  <text class="note" x="1145" y="845">从真实 good case 推演参考答案，再迭代 Prompt 与规则</text>
  <path class="dash" d="M1420 570V629"/>

  <rect x="55" y="905" width="1590" height="95" rx="20" fill="#687a63"/>
  <text x="90" y="946" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="17" font-weight="700" fill="#fff">05 · 数据与主权</text>
  <text x="280" y="946" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="15" fill="#fff">本地保存原文　·　双重 AI 权限　·　导入 / 导出　·　展示模式不读取私人日记</text>
  <text x="280" y="976" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="13" fill="#e5eadf">AI 让产品得以成立，但思考的边界、解释权与最终判断始终属于用户。</text>
</svg>
