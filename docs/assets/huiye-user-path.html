<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>回页 · 用户路径</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f3e8;
      --surface: #fffdf7;
      --ink: #273129;
      --muted: #687066;
      --sage: #5f7259;
      --sage-soft: #e7ece3;
      --gold: #b48952;
      --line: #d8d2c5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 32px 22px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 7px;
      font-family: "Songti SC", "STSong", serif;
      font-size: clamp(25px, 3vw, 38px);
      font-weight: 600;
      letter-spacing: .06em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .08em;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button, .source-link {
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid var(--sage);
      border-radius: 999px;
      background: transparent;
      color: var(--sage);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }

    button:hover, button:focus-visible, .source-link:hover, .source-link:focus-visible {
      background: var(--sage-soft);
      outline: none;
    }

    #zoom-label {
      min-width: 54px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    main { padding: 22px 24px 30px; }

    .legend {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
      margin: 0 auto 16px;
      max-width: 2200px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .mark { display: inline-block; border: 1.5px solid var(--sage); background: var(--surface); }
    .mark.event { width: 17px; height: 17px; border-radius: 50%; }
    .mark.task { width: 25px; height: 16px; border-radius: 4px; }
    .mark.gateway { width: 15px; height: 15px; transform: rotate(45deg); }
    .mark.planned { width: 25px; height: 16px; border-radius: 4px; border-style: dashed; border-color: #918a7b; }

    .canvas {
      position: relative;
      overflow: auto;
      width: 100%;
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 12px 34px rgb(70 67 56 / 8%);
    }

    .diagram-wrap {
      width: 100%;
      min-width: 900px;
      transform-origin: top left;
    }

    #diagram {
      display: block;
      width: 100%;
      height: auto;
    }

    .note {
      max-width: 2200px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 780px) {
      header { align-items: flex-start; flex-direction: column; padding: 22px 20px 18px; }
      .controls { justify-content: flex-start; }
      main { padding: 16px 12px 24px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>回页 · 用户路径</h1>
      <p class="subtitle">BPMN 2.0 ｜ 写作 → 日记池 → 回响</p>
    </div>
    <div class="controls" aria-label="图表缩放工具">
      <button type="button" id="fit">适应窗口</button>
      <button type="button" id="actual">100%</button>
      <button type="button" id="minus" aria-label="缩小">−</button>
      <span id="zoom-label" aria-live="polite">适应</span>
      <button type="button" id="plus" aria-label="放大">＋</button>
      <a class="source-link" href="./huiye-user-path.bpmn" download>下载 BPMN 源文件</a>
    </div>
  </header>

  <main>
    <div class="legend" aria-label="BPMN 图例">
      <span><i class="mark event"></i>开始 / 结束 / 计时事件</span>
      <span><i class="mark task"></i>用户或系统任务</span>
      <span><i class="mark gateway"></i>排他判断</span>
      <span><i class="mark planned"></i>规划中能力</span>
    </div>

    <section class="canvas" id="canvas" aria-label="回页用户路径 BPMN 2.0 流程图">
      <div class="diagram-wrap" id="diagram-wrap">
        <img id="diagram" src="./huiye-user-path-bpmn.svg" alt="回页用户路径 BPMN 2.0 流程图：左侧写作，中间日记池，右侧回响" />
      </div>
    </section>

    <p class="note">实线为当前流程，虚线或浅灰节点为规划能力。流程从具体小模块出发，使用水平或垂直折线；“继续写”会从回响回到写作，保存的新 Entry 再进入下一轮判断。</p>
  </main>

  <script>
    const canvas = document.querySelector('#canvas');
    const wrap = document.querySelector('#diagram-wrap');
    const label = document.querySelector('#zoom-label');
    let zoom = 1;
    let fitMode = true;

    function render() {
      if (fitMode) {
        wrap.style.width = '100%';
        label.textContent = '适应';
        return;
      }
      wrap.style.width = `${2200 * zoom}px`;
      label.textContent = `${Math.round(zoom * 100)}%`;
    }

    function setZoom(next) {
      fitMode = false;
      zoom = Math.min(1.6, Math.max(.45, next));
      render();
    }

    document.querySelector('#fit').addEventListener('click', () => { fitMode = true; render(); });
    document.querySelector('#actual').addEventListener('click', () => setZoom(1));
    document.querySelector('#minus').addEventListener('click', () => setZoom(zoom - .1));
    document.querySelector('#plus').addEventListener('click', () => setZoom(zoom + .1));
    window.addEventListener('resize', () => { if (fitMode) render(); });
    render();
  </script>
</body>
</html>
