<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">回页用户路径</title>
  <desc id="desc">用户保存自我表达，系统低频选择一个候选，以轻提示让用户自愿打开；用户可以沉默、反馈或保存回应，随后结束留白。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#77756b"/></marker>
    <style>
      .title{font:600 30px "Microsoft YaHei",sans-serif;fill:#292821}.sub{font:400 15px "Microsoft YaHei",sans-serif;fill:#77756b}.lane-title{font:600 16px "Microsoft YaHei",sans-serif;fill:#4d5848}.node-title{font:600 15px "Microsoft YaHei",sans-serif;fill:#33342f}.node-copy{font:400 12px "Microsoft YaHei",sans-serif;fill:#77756b}.small{font:400 11px "Microsoft YaHei",sans-serif;fill:#8b877d}.line{fill:none;stroke:#77756b;stroke-width:2;marker-end:url(#arrow)}.soft-line{fill:none;stroke:#b48952;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8f6ef"/>
  <text class="title" x="70" y="62">回页 · 陪伴式跨时重逢</text>
  <text class="sub" x="70" y="91">一次只遇见一页；回应和反馈都可选；结束后不立即补下一条。</text>

  <rect x="55" y="125" width="1490" height="190" rx="18" fill="#fffefa" stroke="#dfddd3"/>
  <rect x="55" y="330" width="1490" height="220" rx="18" fill="#f1f3ee" stroke="#d8ddd3"/>
  <rect x="55" y="565" width="1490" height="275" rx="18" fill="#fffefa" stroke="#dfddd3"/>
  <text class="lane-title" x="78" y="158">01 · 用户留下</text>
  <text class="lane-title" x="78" y="363">02 · 系统在幕后</text>
  <text class="lane-title" x="78" y="598">03 · 用户再次相遇</text>

  <g transform="translate(230 175)">
    <rect width="245" height="95" rx="14" fill="#f7f5ee" stroke="#d6d2c7"/>
    <text class="node-title" x="122" y="35" text-anchor="middle">写下一小片自己</text>
    <text class="node-copy" x="122" y="60" text-anchor="middle">思考、感受、疑问、生活片段</text>
  </g>
  <g transform="translate(650 175)">
    <rect width="245" height="95" rx="14" fill="#e6ebe1" stroke="#bac5b4"/>
    <text class="node-title" x="122" y="35" text-anchor="middle">明确保存 Entry</text>
    <text class="node-copy" x="122" y="60" text-anchor="middle">原话成为可核验的时间证据</text>
  </g>
  <path class="line" d="M475 223H645"/>
  <path class="line" d="M772 270V345H282V385"/>

  <g transform="translate(170 390)">
    <rect width="225" height="105" rx="14" fill="#fffefa" stroke="#cfd5ca"/>
    <text class="node-title" x="112" y="34" text-anchor="middle">候选发现</text>
    <text class="node-copy" x="112" y="59" text-anchor="middle">有证据的联系</text>
    <text class="node-copy" x="112" y="80" text-anchor="middle">或受约束单页回看</text>
  </g>
  <g transform="translate(465 390)">
    <rect width="225" height="105" rx="14" fill="#fffefa" stroke="#cfd5ca"/>
    <text class="node-title" x="112" y="34" text-anchor="middle">质量判断</text>
    <text class="node-copy" x="112" y="59" text-anchor="middle">不只相关、正确</text>
    <text class="node-copy" x="112" y="80" text-anchor="middle">避免复述当前认知</text>
  </g>
  <g transform="translate(760 390)">
    <rect width="225" height="105" rx="14" fill="#fffefa" stroke="#cfd5ca"/>
    <text class="node-title" x="112" y="34" text-anchor="middle">时机约束</text>
    <text class="node-copy" x="112" y="59" text-anchor="middle">时间错位 · 重复 · 冷却</text>
    <text class="node-copy" x="112" y="80" text-anchor="middle">没有合适候选就保持安静</text>
  </g>
  <g transform="translate(1055 390)">
    <rect width="225" height="105" rx="14" fill="#e8dfd0" stroke="#c7a77d"/>
    <text class="node-title" x="112" y="34" text-anchor="middle">只准备一个候选</text>
    <text class="node-copy" x="112" y="59" text-anchor="middle">不累计未读数</text>
    <text class="node-copy" x="112" y="80" text-anchor="middle">不形成待清空队列</text>
  </g>
  <path class="line" d="M395 442H460"/><path class="line" d="M690 442H755"/><path class="line" d="M985 442H1050"/>
  <path class="soft-line" d="M1168 495V580H222V620"/>

  <g transform="translate(140 625)">
    <circle cx="82" cy="58" r="47" fill="#f4ede3" stroke="#b48952" stroke-width="2"/>
    <circle cx="82" cy="58" r="8" fill="#b48952"/>
    <text class="node-title" x="82" y="126" text-anchor="middle">轻轻提示</text>
    <text class="small" x="82" y="146" text-anchor="middle">“有一页在等你”</text>
  </g>
  <g transform="translate(370 625)">
    <rect width="210" height="105" rx="14" fill="#f7f5ee" stroke="#d6d2c7"/>
    <text class="node-title" x="105" y="37" text-anchor="middle">用户自愿打开</text>
    <text class="node-copy" x="105" y="64" text-anchor="middle">原句 → 节选 → 全文</text>
    <text class="node-copy" x="105" y="84" text-anchor="middle">AI 初判位于原文之后</text>
  </g>
  <path class="line" d="M305 682H365"/>

  <g transform="translate(655 610)">
    <rect width="225" height="76" rx="14" fill="#fffefa" stroke="#d6d2c7"/>
    <text class="node-title" x="112" y="31" text-anchor="middle">沉默、回味、离开</text>
    <text class="node-copy" x="112" y="54" text-anchor="middle">不写负面事件</text>
  </g>
  <g transform="translate(655 704)">
    <rect width="225" height="96" rx="14" fill="#f2f3ee" stroke="#cfd5ca"/>
    <text class="node-title" x="112" y="29" text-anchor="middle">可选反馈</text>
    <text class="node-copy" x="112" y="52" text-anchor="middle">有感觉 · 正确无感 · 不太对</text>
    <text class="node-copy" x="112" y="74" text-anchor="middle">校准时机或判断范围</text>
  </g>
  <g transform="translate(955 657)">
    <rect width="225" height="105" rx="14" fill="#e6ebe1" stroke="#bac5b4"/>
    <text class="node-title" x="112" y="34" text-anchor="middle">可选保存回应</text>
    <text class="node-copy" x="112" y="59" text-anchor="middle">一句话或一篇长文都是 Entry</text>
    <text class="node-copy" x="112" y="80" text-anchor="middle">与来源双向可读</text>
  </g>
  <g transform="translate(1270 657)">
    <rect width="205" height="105" rx="52" fill="#f4ede3" stroke="#c7a77d"/>
    <text class="node-title" x="102" y="43" text-anchor="middle">本次结束，留下空白</text>
    <text class="node-copy" x="102" y="68" text-anchor="middle">不立即补下一条</text>
  </g>
  <path class="line" d="M580 677H650"/><path class="line" d="M580 688C620 688 615 752 650 752"/><path class="line" d="M580 693H950"/>
  <path class="line" d="M880 648C1060 590 1190 622 1265 685"/><path class="line" d="M880 752H1265"/><path class="line" d="M1180 710H1265"/>
</svg>
