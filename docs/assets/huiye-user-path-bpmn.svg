<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">回页用户流程图</title>
  <desc id="desc">从写下、选择性归线、AI 线内观察到低打扰回响，并以虚线区分当前评测流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#77786f"/>
    </marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#292821}
      .subtitle{font:15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#77756b}
      .lane-title{font:700 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52604d;letter-spacing:.06em}
      .node-title{font:700 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#292821}
      .body{font:13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#6e6c64}
      .small{font:12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#817e74}
      .node{fill:#fffefa;stroke:#d8d5ca;stroke-width:1.4}
      .green{fill:#e7ede3;stroke:#aebba9;stroke-width:1.4}
      .amber{fill:#f5ecdf;stroke:#d1a66f;stroke-width:1.4}
      .edge{fill:none;stroke:#77786f;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#b07b3e;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .quiet{fill:none;stroke:#a6a39a;stroke-width:1.7;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#f8f6ef"/>
  <text class="title" x="62" y="62">回页 · 用户流程</text>
  <text class="subtitle" x="62" y="91">人先写下并选择性归线；AI 只在线内显化变化。正式回响保持低打扰，评测入口用于当前高频校准。</text>

  <rect x="50" y="125" width="1700" height="230" rx="22" fill="#fffdfa" stroke="#ddd9cf"/>
  <text class="lane-title" x="78" y="163">01 · 用户写下</text>
  <rect class="node" x="105" y="205" width="260" height="105" rx="16"/>
  <text class="node-title" x="135" y="246">写下一篇 Entry</text>
  <text class="body" x="135" y="278">推理 · 疑问 · 感受 · 正在形成的看法</text>
  <rect class="amber" x="465" y="205" width="260" height="105" rx="16"/>
  <text class="node-title" x="495" y="246">是否加入思考线？</text>
  <text class="body" x="495" y="278">完全可选，可同时选择多条线</text>
  <rect class="green" x="825" y="205" width="270" height="105" rx="16"/>
  <text class="node-title" x="855" y="246">加入一条或多条线</text>
  <text class="body" x="855" y="278">入口：写下时 / 日记池编辑时</text>
  <rect class="node" x="1195" y="205" width="245" height="105" rx="16"/>
  <text class="node-title" x="1225" y="246">留在日记池</text>
  <text class="body" x="1225" y="278">不强迫整理，未来可再归线</text>
  <rect class="node" x="1510" y="205" width="190" height="105" rx="16"/>
  <text class="node-title" x="1540" y="246">保存完成</text>
  <text class="body" x="1540" y="278">原文与权限归用户</text>
  <path class="edge" d="M365 257H454"/>
  <path class="edge" d="M725 240H814"/>
  <text class="small" x="760" y="228">是</text>
  <path class="quiet" d="M725 282C875 340 1070 340 1195 282"/>
  <text class="small" x="938" y="333">否</text>
  <path class="edge" d="M1095 257H1184"/>
  <path class="edge" d="M1440 257H1499"/>

  <rect x="50" y="380" width="1700" height="205" rx="22" fill="#edf1ea" stroke="#ced7c9"/>
  <text class="lane-title" x="78" y="418">02 · 用户随时查看思考线</text>
  <rect class="green" x="205" y="455" width="330" height="90" rx="16"/>
  <text class="node-title" x="235" y="493">打开一条思考线</text>
  <text class="body" x="235" y="522">最新笔记在上，先看五行预览</text>
  <rect class="node" x="710" y="455" width="330" height="90" rx="16"/>
  <text class="node-title" x="740" y="493">展开原文或回味轨迹</text>
  <text class="body" x="740" y="522">也可移出此线；详情页不承担归线</text>
  <rect class="node" x="1215" y="455" width="330" height="90" rx="16"/>
  <text class="node-title" x="1245" y="493">看见已有回响点</text>
  <text class="body" x="1245" y="522">看过的回响留在线上，可再次打开</text>
  <path class="edge" d="M535 500H699"/>
  <path class="edge" d="M1040 500H1204"/>

  <rect x="50" y="610" width="1700" height="235" rx="22" fill="#e7ede3" stroke="#b9c5b4"/>
  <text class="lane-title" x="78" y="648">03 · AI 在线内观察 · 用户不需要操作</text>
  <rect class="node" x="105" y="685" width="300" height="115" rx="16"/>
  <text class="node-title" x="135" y="727">检查候选条件</text>
  <text class="body" x="135" y="758">同一 active 思考线 · 至少两篇</text>
  <text class="small" x="135" y="783">整线允许 + 每篇 aiLink=true</text>
  <rect class="node" x="500" y="685" width="300" height="115" rx="16"/>
  <text class="node-title" x="530" y="727">观察思考变化</text>
  <text class="body" x="530" y="758">延续 · 修正 · 分支 · 冲突</text>
  <text class="small" x="530" y="783">或仍未解决的问题</text>
  <rect class="amber" x="895" y="685" width="300" height="115" rx="16"/>
  <text class="node-title" x="925" y="727">值得现在带回吗？</text>
  <text class="body" x="925" y="758">证据充分 · 有显化价值 · 时机合适</text>
  <text class="small" x="925" y="783">否则保持安静</text>
  <rect class="green" x="1290" y="685" width="300" height="115" rx="16"/>
  <text class="node-title" x="1320" y="727">形成一条 EchoRecord</text>
  <text class="body" x="1320" y="758">原文证据 + 可修正的 AI 初判</text>
  <text class="small" x="1320" y="783">不构成待清空的队列</text>
  <path class="edge" d="M405 742H489"/>
  <path class="edge" d="M800 742H884"/>
  <path class="edge" d="M1195 742H1279"/>
  <path class="quiet" d="M1045 800V829H760"/>
  <text class="small" x="805" y="822">不合适：本次结束</text>

  <rect x="50" y="870" width="1120" height="280" rx="22" fill="#fbf2e7" stroke="#dcc09a"/>
  <text class="lane-title" x="78" y="908" fill="#8a6538">04 · 正式回响 · 温暖、低打扰</text>
  <circle cx="145" cy="992" r="39" fill="#f5ecdf" stroke="#bd894c" stroke-width="2"/>
  <circle cx="145" cy="992" r="9" fill="#ad7c42"/>
  <text class="node-title" x="102" y="1060">轻提示</text>
  <rect class="node" x="245" y="950" width="265" height="105" rx="16"/>
  <text class="node-title" x="275" y="991">用户自愿打开</text>
  <text class="body" x="275" y="1022">原句 → 节选 → 全文 → AI 初判</text>
  <rect class="node" x="605" y="925" width="245" height="80" rx="16"/>
  <text class="node-title" x="635" y="960">沉默或回味</text>
  <text class="body" x="635" y="986">什么都不做也可以</text>
  <rect class="green" x="605" y="1025" width="245" height="80" rx="16"/>
  <text class="node-title" x="635" y="1060">可选反馈</text>
  <text class="body" x="635" y="1086">看清一点 / 已知 / 不太对</text>
  <rect class="green" x="930" y="950" width="200" height="105" rx="16"/>
  <text class="node-title" x="960" y="991">保存回应</text>
  <text class="body" x="960" y="1022">形成新的 Entry</text>
  <path class="edge" d="M184 992H234"/>
  <path class="edge" d="M510 980H594"/>
  <path class="edge" d="M510 1025C545 1065 560 1065 594 1065"/>
  <path class="edge" d="M850 1065H919"/>
  <path class="quiet" d="M850 965C1000 900 1085 900 1125 940"/>
  <text class="small" x="895" y="912">结束后不立即补下一条</text>

  <rect x="1200" y="870" width="550" height="280" rx="22" fill="#f4eee4" stroke="#c79557" stroke-width="1.5" stroke-dasharray="10 8"/>
  <text class="lane-title" x="1228" y="908" fill="#8a6538">05 · 当前评测 · 高频校准，不打扰正式体验</text>
  <rect class="amber" x="1240" y="948" width="205" height="85" rx="15"/>
  <text class="node-title" x="1270" y="984">生成评测 case</text>
  <text class="body" x="1270" y="1010">真实线内候选</text>
  <rect class="node" x="1500" y="948" width="205" height="85" rx="15"/>
  <text class="node-title" x="1530" y="984">人工判断与归因</text>
  <text class="body" x="1530" y="1010">good / bad + 反馈</text>
  <path class="dash" d="M1445 990H1489"/>
  <path class="dash" d="M1602 1033V1082H1343V1044"/>
  <text class="small" x="1380" y="1105">积累评测集 → 形成标准 → 迭代 Prompt 与规则</text>
  <path class="dash" d="M1440 800V859"/>
</svg>
