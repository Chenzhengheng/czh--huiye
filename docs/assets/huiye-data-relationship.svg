<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050" role="img" aria-labelledby="title desc">
  <title id="title">回页数据关系图</title>
  <desc id="desc">Entry、ThoughtLine、EchoRecord、EchoReply、CaseRecord 与评测工作台之间的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#77786f"/>
    </marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#292821}
      .subtitle{font:15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#77756b}
      .lane-title{font:700 16px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#52604d;letter-spacing:.08em}
      .box-title{font:700 21px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#292821}
      .label{font:14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#68675f}
      .small{font:13px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#77756b}
      .edge{fill:none;stroke:#77786f;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#b07b3e;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .card{fill:#fffefa;stroke:#d9d6cb;stroke-width:1.5}
      .green{fill:#e7ede3;stroke:#aebba9;stroke-width:1.5}
      .amber{fill:#f5ecdf;stroke:#d1a66f;stroke-width:1.5}
      .workspace{fill:#fbf4e9;stroke:#c79557;stroke-width:1.5;stroke-dasharray:10 8}
      .rule{stroke:#dedbd1;stroke-width:1}
    </style>
  </defs>
  <rect width="1700" height="1050" fill="#f8f6ef"/>
  <text class="title" x="62" y="62">回页 · 数据关系</text>
  <text class="subtitle" x="62" y="91">产品数据记录真实思考与线内观察；评测工作台从真实数据构造案例，不复制私人原文。</text>

  <rect x="55" y="125" width="1110" height="860" rx="22" fill="#fffdfa" stroke="#ddd9cf"/>
  <text class="lane-title" x="82" y="164">01 · 已持久化的产品数据</text>

  <rect class="card" x="90" y="205" width="315" height="300" rx="18"/>
  <text class="box-title" x="120" y="247">Entry · 日记</text>
  <text class="label" x="120" y="282">id · content · timestamp</text>
  <text class="label" x="120" y="312">tags · thoughtLineIds[]</text>
  <text class="label" x="120" y="342">aiLink · continuesFrom?</text>
  <line class="rule" x1="120" y1="370" x2="375" y2="370"/>
  <text class="small" x="120" y="402">用户确认保存后才成为事实</text>
  <text class="small" x="120" y="430">可不归线，也可属于多条线</text>
  <text class="small" x="120" y="458">aiLink=false 时 AI 必须跳过</text>

  <rect class="green" x="485" y="205" width="315" height="245" rx="18"/>
  <text class="box-title" x="515" y="247">ThoughtLine · 思考线</text>
  <text class="label" x="515" y="282">id · name · status</text>
  <text class="label" x="515" y="312">allowEcho · mergedIntoId?</text>
  <line class="rule" x1="515" y1="337" x2="770" y2="337"/>
  <text class="small" x="515" y="369">用户主动建立的主题边界</text>
  <text class="small" x="515" y="397">一篇日记可成为多线交汇处</text>
  <text class="small" x="515" y="425">allowEcho=false 时整线保持安静</text>

  <rect class="green" x="485" y="575" width="315" height="320" rx="18"/>
  <text class="box-title" x="515" y="617">EchoRecord · 回响记录</text>
  <text class="label" x="515" y="652">id · thoughtLineId</text>
  <text class="label" x="515" y="682">sourceEntryIds[] · evidence</text>
  <text class="label" x="515" y="712">relationType · lifecycle</text>
  <text class="label" x="515" y="742">events[] · prompt/rule version</text>
  <line class="rule" x1="515" y1="768" x2="770" y2="768"/>
  <text class="small" x="515" y="800">至少引用同线两篇可观察日记</text>
  <text class="small" x="515" y="828">AI 初判可被用户否定</text>
  <text class="small" x="515" y="856">查看与反馈记录为事件，回应独立保存</text>

  <rect class="card" x="875" y="205" width="240" height="175" rx="18"/>
  <text class="box-title" x="905" y="247">EchoReply</text>
  <text class="label" x="905" y="282">echoRecordId · content</text>
  <text class="label" x="905" y="312">createdAt · updatedAt</text>
  <line class="rule" x1="905" y1="334" x2="1085" y2="334"/>
  <text class="small" x="905" y="363">不是 Entry，不自动参与回响</text>

  <rect class="amber" x="875" y="650" width="240" height="190" rx="18"/>
  <text class="box-title" x="905" y="692">CaseRecord</text>
  <text class="label" x="905" y="727">echoRecordId · verdict</text>
  <text class="label" x="905" y="757">feedback · reasonCodes</text>
  <line class="rule" x1="905" y1="779" x2="1085" y2="779"/>
  <text class="small" x="905" y="808">只引用，不复制原文</text>

  <path class="edge" d="M405 290H474"/>
  <path class="edge" d="M485 345H416"/>
  <text class="small" x="420" y="275">0..N</text>
  <text class="small" x="438" y="366">0..N</text>
  <path class="edge" d="M642 450V564"/>
  <text class="small" x="658" y="520">1 条线产生 0..N 条回响</text>
  <path class="edge" d="M405 445C450 505 420 675 474 690"/>
  <text class="small" x="120" y="548">EchoRecord 引用至少 2 篇来源 Entry</text>
  <path class="edge" d="M800 650C850 600 885 410 930 389"/>
  <text class="small" x="812" y="600">0..1</text>
  <path class="edge" d="M800 735H864"/>
  <text class="small" x="820" y="718">0..1</text>

  <rect class="workspace" x="1205" y="125" width="440" height="860" rx="22"/>
  <text class="lane-title" x="1235" y="164" fill="#8a6538">02 · 评测工作台 · 逐步建立</text>

  <rect class="card" x="1240" y="205" width="370" height="155" rx="16"/>
  <text class="box-title" x="1270" y="246">EvaluationSet · 评测集</text>
  <text class="small" x="1270" y="282">真实 Entry + ThoughtLine + 候选输入</text>
  <text class="small" x="1270" y="310">不另存一份私人原文副本</text>
  <text class="small" x="1270" y="338">覆盖不同时间跨度与关系类型</text>

  <rect class="green" x="1240" y="405" width="370" height="145" rx="16"/>
  <text class="box-title" x="1270" y="446">ModelOutputSet · 模型输出集</text>
  <text class="small" x="1270" y="482">同一评测集上的 EchoRecord 候选</text>
  <text class="small" x="1270" y="510">保留模型、Prompt 与规则版本</text>

  <rect class="amber" x="1240" y="595" width="370" height="145" rx="16"/>
  <text class="box-title" x="1270" y="636">EvaluationCriteria · 评测标准</text>
  <text class="small" x="1270" y="672">先看显化价值，再看相关性与证据</text>
  <text class="small" x="1270" y="700">good / bad、三类反馈与用户原话分别归因</text>

  <rect class="card" x="1240" y="785" width="370" height="145" rx="16" stroke-dasharray="8 6"/>
  <text class="box-title" x="1270" y="826">ReferenceAnswer · 参考答案</text>
  <text class="small" x="1270" y="862">当前尚未建立</text>
  <text class="small" x="1270" y="890">从稳定 good case 中逐步推演</text>

  <path class="edge" d="M1425 360V394"/>
  <path class="edge" d="M1425 550V584"/>
  <path class="dash" d="M1425 740V774"/>
  <path class="dash" d="M1115 745C1175 745 1170 670 1229 670"/>
  <text class="small" x="1072" y="625">人工反馈进入标准校准</text>
  <path class="dash" d="M800 610C1030 590 1120 280 1229 280"/>
  <text class="small" x="975" y="520">从真实产品记录构造输入</text>

  <rect x="55" y="1005" width="1590" height="1" fill="#ddd9cf"/>
  <text class="small" x="62" y="1033">实线：当前数据关系　·　虚线：评测构造　·　EchoReply 与反馈互不推断</text>
</svg>
