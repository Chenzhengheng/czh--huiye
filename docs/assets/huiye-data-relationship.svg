<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">回页数据关系图</title><desc id="desc">Entry、EchoRecord、呈现快照、反馈、回应 Entry 和 CaseRecord 的关系。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6f716a"/></marker><style>.t{font:600 30px "Microsoft YaHei",sans-serif;fill:#292821}.s{font:400 14px "Microsoft YaHei",sans-serif;fill:#77756b}.h{font:600 17px "Microsoft YaHei",sans-serif;fill:#33342f}.p{font:400 12px "Microsoft YaHei",sans-serif;fill:#6f716a}.l{fill:none;stroke:#6f716a;stroke-width:2;marker-end:url(#a)}.d{fill:none;stroke:#b48952;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="860" fill="#f8f6ef"/><text class="t" x="65" y="60">回页 · 数据关系</text><text class="s" x="65" y="88">只保存三类业务记录；呈现、反馈与双向连接从记录中推导。</text>
  <g transform="translate(80 170)"><rect width="270" height="125" rx="15" fill="#fffefa" stroke="#d7d3c8"/><text class="h" x="135" y="37" text-anchor="middle">来源 Entry A</text><text class="p" x="135" y="66" text-anchor="middle">用户确认的原话</text><text class="p" x="135" y="89" text-anchor="middle">原意受到保护</text></g>
  <g transform="translate(80 405)"><rect width="270" height="125" rx="15" fill="#fffefa" stroke="#d7d3c8"/><text class="h" x="135" y="37" text-anchor="middle">来源 Entry B（可选）</text><text class="p" x="135" y="66" text-anchor="middle">联系回响需要两篇或更多</text><text class="p" x="135" y="89" text-anchor="middle">单页回看只引用一篇</text></g>
  <g transform="translate(475 270)"><rect width="310" height="180" rx="18" fill="#e6ebe1" stroke="#bac5b4" stroke-width="2"/><text class="h" x="155" y="39" text-anchor="middle">EchoRecord</text><text class="p" x="155" y="70" text-anchor="middle">来源 ID · 原文证据</text><text class="p" x="155" y="94" text-anchor="middle">发现时间 · 最早展示时间</text><text class="p" x="155" y="118" text-anchor="middle">呈现历史 · 反馈 · 回应事件</text><text class="p" x="155" y="148" text-anchor="middle">不是卡片，也不是 AI 结论</text></g>
  <path class="l" d="M350 232H425V325H470"/><path class="l" d="M350 468H425V395H470"/>
  <g transform="translate(900 125)"><rect width="305" height="150" rx="16" fill="#f4ede3" stroke="#c7a77d"/><text class="h" x="152" y="37" text-anchor="middle">EchoPresentation</text><text class="p" x="152" y="67" text-anchor="middle">当次 AI 浓缩与解释性初判</text><text class="p" x="152" y="91" text-anchor="middle">可选问题 · Prompt/规则/模型版本</text><text class="p" x="152" y="119" text-anchor="middle">同一关系可有新的呈现快照</text></g>
  <path class="l" d="M785 323C835 323 838 200 895 200"/>
  <g transform="translate(900 340)"><rect width="305" height="145" rx="16" fill="#fffefa" stroke="#d7d3c8"/><text class="h" x="152" y="36" text-anchor="middle">可选反馈事件</text><text class="p" x="152" y="65" text-anchor="middle">有那种感觉</text><text class="p" x="152" y="88" text-anchor="middle">说得对，但没感觉</text><text class="p" x="152" y="111" text-anchor="middle">不太对 + 可选否定范围</text></g>
  <path class="l" d="M785 360H895"/>
  <g transform="translate(900 565)"><rect width="305" height="145" rx="16" fill="#e6ebe1" stroke="#bac5b4"/><text class="h" x="152" y="36" text-anchor="middle">回应 Entry C / D / …</text><text class="p" x="152" y="66" text-anchor="middle">一句话与长文资格相同</text><text class="p" x="152" y="90" text-anchor="middle">允许多个、分叉、矛盾并存</text><text class="p" x="152" y="115" text-anchor="middle">保存后与全部来源双向可读</text></g>
  <path class="l" d="M730 450C730 625 820 638 895 638"/><path class="d" d="M900 672C650 800 240 730 215 535"/><path class="d" d="M900 610C650 520 355 580 215 300"/>
  <g transform="translate(1270 335)"><rect width="180" height="150" rx="16" fill="#f2f3ee" stroke="#cfd5ca"/><text class="h" x="90" y="37" text-anchor="middle">CaseRecord</text><text class="p" x="90" y="67" text-anchor="middle">good / bad</text><text class="p" x="90" y="91" text-anchor="middle">reason codes</text><text class="p" x="90" y="115" text-anchor="middle">只引用，不复制正文</text></g>
  <path class="l" d="M1205 412H1265"/>
  <g transform="translate(80 690)"><rect width="520" height="100" rx="14" fill="#f2f3ee" stroke="#cfd5ca"/><text class="h" x="25" y="35">派生视图（不单独保存）</text><text class="p" x="25" y="65">当前单个候选 · 双向连接 · 思考线 · 思考拓扑</text></g>
  <path class="d" d="M630 450V650C630 700 605 730 600 730"/>
</svg>
